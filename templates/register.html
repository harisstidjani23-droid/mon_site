{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Inscription</h3>
            </div>
            <div class="card-body">

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="/register" id="registerForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur :</label>
                        <input type="text" class="form-control" id="username" name="username" required minlength="3">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email :</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                        <div class="invalid-feedback" id="emailFeedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe (min 8 caractères) :</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" required minlength="8">
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmer le mot de passe :</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#confirm_password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" id="confirmFeedback"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="submitBtn">S'inscrire</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/login">Déjà un compte ? Se connecter</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    const emailFeedback = document.getElementById('emailFeedback');
    const confirmFeedback = document.getElementById('confirmFeedback');

    document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', function() {
            const target = document.querySelector(this.dataset.target);
            const icon = this.querySelector('i');
            if (target.type === 'password') {
                target.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                target.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    });

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    emailInput.addEventListener('input', function() {
        if (this.value && !emailRegex.test(this.value)) {
            this.classList.add('is-invalid');
            emailFeedback.textContent = 'Format d\'email invalide (ex: user@exemple.com)';
            emailFeedback.style.display = 'block';
        } else {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
            emailFeedback.style.display = 'none';
        }
    });

    confirmInput.addEventListener('input', function() {
        if (this.value !== passwordInput.value) {
            this.classList.add('is-invalid');
            confirmFeedback.textContent = 'Les mots de passe ne correspondent pas';
            confirmFeedback.style.display = 'block';
        } else {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
            confirmFeedback.style.display = 'none';
        }
    });

    passwordInput.addEventListener('input', function() {
        if (this.value.length < 8) {
            this.classList.add('is-invalid');
        } else {
            this.classList.remove('is-invalid');
        }
        confirmInput.dispatchEvent(new Event('input'));
    });

    form.addEventListener('submit', function(e) {
        let valid = true;
        if (!emailRegex.test(emailInput.value)) {
            e.preventDefault();
            emailInput.classList.add('is-invalid');
            valid = false;
        }
        if (confirmInput.value !== passwordInput.value || passwordInput.value.length < 8) {
            e.preventDefault();
            confirmInput.classList.add('is-invalid');
            valid = false;
        }
        if (!valid) {
            e.preventDefault();
        }
    });
});
</script>

<style>
.toggle-password:hover {
    background-color: #f8f9fa;
}
</style>

{% endblock %}
