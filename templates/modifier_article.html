{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Modifier l'article</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="/modifier_article/{{ article[0] }}">
                    <div class="mb-3">
                        <label class="form-label">Titre :</label>
                        <input type="text" class="form-control" name="titre" value="{{ article[1] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contenu :</label>
                        <textarea class="form-control" name="contenu" rows="8" required>{{ article[2] }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Modifier</button>
                    <a href="/articles" class="btn btn-secondary w-100 mt-2">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
