{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Modifier l'utilisateur</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="/modifier/{{ user_id }}">
                    <div class="mb-3">
                        <label class="form-label">Nom d'utilisateur :</label>
                        <input type="text" class="form-control" name="username" value="{{ user[1] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email :</label>
                        <input type="email" class="form-control" name="email" value="{{ user[2] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nouveau mot de passe :</label>
                        <input type="password" class="form-control" name="password" placeholder="Laisser vide pour ne pas changer">
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Modifier</button>
                    <a href="/users" class="btn btn-secondary w-100 mt-2">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
